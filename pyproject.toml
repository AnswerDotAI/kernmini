[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "kernmini"
dynamic = ["version"]
description = "Everything a Jupyter kernel needs except the language"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = ["fastcore>=2.2.17"]

[project.optional-dependencies]
dev = [
  "conkernelclient>=0.0.22",
  "debugpy>=1.8.21",
  "fastship>=0.0.11",
  "ipymini>=0.1.20",
  "jupywire>=0.0.1",
  "loopmini>=0.2.0",
  "maturin>=1.0,<2.0",
  "pytest>=9.1.1",
  "pytest-asyncio",
  "pytest-timeout",
  "pytest-xdist",
  "pyzmq>=27.2.0",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/kernmini"
Repository = "https://github.com/AnswerDotAI/kernmini"
Issues = "https://github.com/AnswerDotAI/kernmini/issues"

[tool.maturin]
python-source = "."
module-name = "kernmini._native"
features = ["extension-module"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.rs" },
  { file = "Cargo.toml" },
  { file = ".git/fastws-cargo-key" },
]

[tool.fastship]
branch = "main"
