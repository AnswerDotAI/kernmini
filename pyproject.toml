[build-system]
requires = ["maturin>=1.9.2,<2.0", "fastws-cli>=0.0.42"]
build-backend = "fastws.build_backend"

[project]
name = "kernmini"
dynamic = ["version"]
description = "Everything a Jupyter kernel needs except the language"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = ["fastcore>=2.2.17"]

[project.optional-dependencies]
test = [
  "fastws-cli>=0.0.42",
  "conkernelclient>=0.0.23",
  "debugpy>=1.8.21",
  "jupywire>=0.0.1",
  "loopmini>=0.2.0",
  "pytest>=9.1.1",
  "pytest-asyncio",
  "pytest-timeout",
  "pytest-xdist",
  "pyzmq>=27.2.0",
]
dev = [
  "fastship>=0.0.11",
  "maturin>=1.0,<2.0",
  "kernmini[test]",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/kernmini"
Repository = "https://github.com/AnswerDotAI/kernmini"
Issues = "https://github.com/AnswerDotAI/kernmini/issues"

Documentation = "https://AnswerDotAI.github.io/kernmini/"
[tool.maturin]
manifest-path = "py/Cargo.toml"
python-source = "."
module-name = "kernmini._native"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "py/Cargo.toml" },
]

[tool.fastship]
branch = "main"
