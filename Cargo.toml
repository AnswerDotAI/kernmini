[workspace]
members = ["py"]
default-members = [".", "py"]

[workspace.package]
version = "0.1.18"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[package]
name = "kernmini"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Everything a Jupyter kernel needs except the language"
repository = "https://github.com/AnswerDotAI/kernmini"
include = ["/src/**", "/LICENSE", "/README.md"]

[dependencies]
async-trait.workspace = true
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
zmtpmini = "0.1.4"

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.kernmini]
incremental = true

[profile.release.package.kernmini-py]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.kernmini]
incremental = false

[profile.dist.package.kernmini-py]
incremental = false
